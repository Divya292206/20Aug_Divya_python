<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Profile | Artist Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0F0C29] text-white min-h-screen">

<!-- ================= NAVBAR ================= -->
<nav class="flex justify-between items-center px-12 py-5 bg-[#0B1220] border-b border-white/10 fixed w-full z-50">
  <h1 class="text-2xl font-bold tracking-wide text-amber-400">🎨 Artist Hub</h1>

  <div class="space-x-6 text-sm font-semibold">
    <a href="{% url 'artist_dashboard' %}" class="hover:text-amber-400">Dashboard</a>
    <a href="#" class="hover:text-amber-400">Bookings</a>
    <a href="#" class="hover:text-amber-400">Media</a>
    <a href="#" class="text-amber-400">Profile</a>
    <a href="/logout/" class="text-red-400">Logout</a>
  </div>
</nav>

<!-- ================= PROFILE SECTION ================= -->
<section class="pt-32 px-12 max-w-5xl mx-auto">

  <h2 class="text-4xl font-extrabold mb-10 text-orange-400">
    👤 My Profile
  </h2>

  <div class="bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-10 shadow-xl">

    <form method="post" class="grid md:grid-cols-2 gap-6">
      {% csrf_token %}

      <!-- Full Name -->
      <div>
        <label class="block text-sm text-white/70 mb-2">Full Name</label>
        <input type="text" name="full_name"
               value="{{ artist.user.full_name }}"
               class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/20 focus:outline-none">
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm text-white/70 mb-2">Email</label>
        <input type="email"
               value="{{ artist.user.email }}"
               readonly
               class="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/20 cursor-not-allowed">
      </div>

      <!-- Mobile -->
      <div>
        <label class="block text-sm text-white/70 mb-2">Mobile</label>
        <input type="text" name="mobile"
               value="{{ artist.user.mobile }}"
               class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/20 focus:outline-none">
      </div>

      <!-- Category (Admin Controlled) -->
      <div>
        <label class="block text-sm text-white/70 mb-2">Category</label>
        <input type="text"
               value="{{ artist.category }}"
               readonly
               class="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/20 cursor-not-allowed">
      </div>

      <!-- Experience (Admin Controlled) -->
      <div>
        <label class="block text-sm text-white/70 mb-2">Experience (Years)</label>
        <input type="number"
               value="{{ artist.experience }}"
               readonly
               class="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/20 cursor-not-allowed">
      </div>

      <!-- Status -->
      <div>
        <label class="block text-sm text-white/70 mb-2">Profile Status</label>
        <input type="text"
               value="{{ artist.status }}"
               readonly
               class="w-full px-4 py-3 rounded-xl bg-black/60 border border-white/20 text-green-400 font-semibold">
      </div>

      <!-- Bio -->
      <div class="md:col-span-2">
        <label class="block text-sm text-white/70 mb-2">Bio</label>
        <textarea name="bio" rows="4"
                  class="w-full px-4 py-3 rounded-xl bg-black/40 border border-white/20 focus:outline-none">{{ artist.bio }}</textarea>
      </div>

      <!-- Button -->
      <div class="md:col-span-2 text-center mt-6">
        <button
          class="px-10 py-3 rounded-full bg-gradient-to-r from-pink-500 to-orange-400 font-bold text-lg hover:scale-105 transition">
          Update Profile
        </button>
      </div>

    </form>

  </div>

</section>

<!-- ================= FOOTER ================= -->
<footer class="py-8 text-center text-white/60 mt-20">
  © 2025 Artist Hub • Artist Profile
</footer>

</body>
</html>
