<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Artist Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-r from-indigo-900 to-purple-900">

    <div class="w-full max-w-md bg-white/10 backdrop-blur-lg rounded-2xl shadow-xl p-8 text-white">

        <h2 class="text-3xl font-bold text-center mb-6">Login</h2>

        <form method="POST">
            {% csrf_token %}

            <!-- Email -->
            <div class="mb-4">
                <label class="block text-sm mb-2">Email</label>
                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-black/40 border border-white/20 focus:outline-none focus:ring-2 focus:ring-pink-400"
                >
            </div>

            <!-- Password -->
            <div class="mb-6">
                <label class="block text-sm mb-2">Password</label>
                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    class="w-full px-4 py-3 rounded-lg bg-black/40 border border-white/20 focus:outline-none focus:ring-2 focus:ring-pink-400"
                >
            </div>

            <!-- Login Button -->
            <button
                type="submit"
                class="w-full py-3 rounded-lg bg-pink-500 hover:bg-pink-600 transition font-semibold"
            >
                Login
            </button>
        </form>

       

    </div>

</body>
</html>
