<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Customer Details | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#080614] text-white flex items-center justify-center p-6">

  <!-- Glow Background -->
  <div class="absolute w-[500px] h-[500px] bg-purple-500 blur-[250px] opacity-20"></div>

  <!-- Customer Card -->
  <div class="relative bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl shadow-2xl p-8 max-w-2xl w-full z-10">

    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-extrabold">Customer Details</h1>
      <a href="{% url 'admin_customers_list' %}" class="px-4 py-2 rounded-full bg-white/10 border border-white/20 hover:bg-white/20 transition">
        ← Back
      </a>
    </div>

    <!-- Customer Info -->
    <div class="space-y-4 text-white/80">
      <p><span class="font-semibold text-white">ID:</span> {{ customer.id }}</p>
      <p><span class="font-semibold text-white">Full Name:</span> {{ customer.full_name }}</p>
      <p><span class="font-semibold text-white">Email:</span> {{ customer.email }}</p>
      <p><span class="font-semibold text-white">Phone:</span> {{ customer.mobile }}</p>
      <p><span class="font-semibold text-white">User Type:</span> {{ customer.user_type|capfirst }}</p>
    </div>

    <!-- Actions -->
    <div class="mt-6 flex gap-4 justify-start">
      <!-- Delete Button -->
      <form method="POST" action="{% url 'admin_customer_delete' customer.id %}">
        {% csrf_token %}
        <button type="submit"
          class="px-4 py-2 rounded-full bg-red-500 hover:bg-red-600 font-semibold transition"
          onclick="return confirm('Are you sure you want to delete this customer?');">
          Delete
        </button>
      </form>

      <!-- Back Button -->
      <a href="{% url 'admin_customers_list' %}"
        class="px-4 py-2 rounded-full bg-gray-700 hover:bg-gray-600 font-semibold transition">
        Back
      </a>
    </div>

  </div>

</body>
</html>
