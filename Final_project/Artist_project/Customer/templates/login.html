<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Artist Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-[#080614] text-white">

  <div class="relative bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-10 w-full max-w-md shadow-2xl">

    <h2 class="text-4xl font-extrabold text-center mb-8">
      Login 🎤
    </h2>

    {% if error %}
      <h3 class="text-center text-red-400 text-lg font-bold mb-4">{{ error }}</h3>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <div class="mb-4">
        <input type="email" name="email" placeholder="Email" required
               class="w-full px-4 py-3 rounded-lg bg-black/40 border border-white/20 focus:outline-none">
      </div>

      <div class="mb-6">
        <input type="password" name="password" placeholder="Password" required
               class="w-full px-4 py-3 rounded-lg bg-black/40 border border-white/20 focus:outline-none">
      </div>

      <button
        class="w-full py-3 rounded-full bg-gradient-to-r from-pink-500 to-orange-400 font-bold hover:scale-105 transition">
        Login
      </button>
    </form>

    <p class="text-center text-white/60 mt-6">
      Don't have an account?
      <a href="/signup/" class="text-orange-400 font-semibold">Sign Up</a>
    </p>

  </div>

</body>
</html>
