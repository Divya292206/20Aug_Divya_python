<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Booking Confirmed | Artist Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-[#0F0C29] via-[#302B63] to-[#24243E] text-white px-6">

  <!-- Success Card -->
  <div class="max-w-md w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-3xl p-10 shadow-2xl text-center">

    <!-- Icon -->
    <div class="flex justify-center mb-6">
      <div class="w-20 h-20 flex items-center justify-center rounded-full bg-green-500/20 border border-green-400">
        <span class="text-4xl">✅</span>
      </div>
    </div>

    <!-- Title -->
    <h1 class="text-3xl font-extrabold text-green-400 mb-4">
      Booking Confirmed!
    </h1>

    <!-- Message -->
    <p class="text-white/70 leading-relaxed mb-8">
      Your booking has been submitted successfully.  
      The artist will contact you shortly.
    </p>

    <!-- Action Button -->
    <a href="/search_artist/"
       class="inline-block w-full py-4 rounded-full bg-gradient-to-r from-pink-500 to-orange-400 font-bold text-lg hover:scale-105 hover:shadow-xl transition-all duration-300">
      🔍 Back to Search
    </a>

  </div>

</body>
</html>
