<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Patients | MediTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen font-sans">

<!-- Navbar -->
<nav class="bg-teal-600 text-white px-6 py-4 flex justify-between items-center shadow-md">
  <h1 class="font-bold text-2xl tracking-wide">MediTrack Admin</h1>
  <a href="/admin/logout/" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 transition font-semibold shadow">
    Logout
  </a>
</nav>

<div class="flex flex-col md:flex-row">

  <!-- Sidebar -->
  <aside class="w-full md:w-64 bg-gradient-to-b from-teal-500 to-teal-700 text-white h-auto md:h-screen p-6 space-y-6 rounded-r-xl shadow-lg">
    <h2 class="text-lg font-bold mb-4 tracking-wide">Menu</h2>
    <ul class="space-y-2">
          <li><a href="/adminapp/admin_dashboard" class="block p-3 rounded-lg hover:bg-teal-400 transition font-medium"><b>Dashboard</b></a></li>
          <li><a href="#" class="block p-3 rounded-lg hover:bg-teal-400 transition font-medium">Patients</a></li>
          <li><a href="/adminapp/admin_doctors_data" class="block p-3 rounded-lg hover:bg-teal-400 transition font-medium">Doctors</a></li>
          <li><a href="/adminapp/admin_appointments" class="block p-3 rounded-lg hover:bg-teal-400 transition font-medium">Appointments</a></li>
        </ul>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-6">

    <h2 class="text-3xl font-extrabold mb-6 text-gray-800 tracking-wide">
      Patient Management
    </h2>

    <!-- Patient Table -->
    <div class="bg-white rounded-xl shadow-md overflow-x-auto">

      <table class="min-w-full text-sm">
        <thead class="bg-teal-100 text-teal-900">
          <tr>
            <th class="px-4 py-3 text-left">Name</th>
            <th class="px-4 py-3 text-left">Email</th>
            <th class="px-4 py-3 text-left">Role</th>
            <th class="px-4 py-3 text-left">Action</th>
          </tr>
        </thead>

        <tbody>
          {% for patient in patients %}
          <tr class="border-b hover:bg-gray-50 transition">
            <td class="px-4 py-3 font-medium">{{ patient.name }}</td>
            <td class="px-4 py-3">{{ patient.email }}</td>
            <td class="px-4 py-3">
              <span class="bg-green-100 text-green-700 px-2 py-1 rounded-full text-xs font-semibold">
                {{ patient.role }}
              </span>
            </td>
            <td class="px-4 py-3 space-x-2">
 
  <a href="{% url 'patient_delete' patient.id %}"
     onclick="return confirm('Are you sure you want to delete this patient?')"
     class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-xs">
    Delete
  </a>
</td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="5" class="text-center py-6 text-gray-500">
              No patients found
            </td>
          </tr>
          {% endfor %}
        </tbody>

      </table>
    </div>

  </main>
</div>

</body>
</html>
