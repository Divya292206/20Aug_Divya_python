<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | MediTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-100 to-pink-100 min-h-screen flex items-center justify-center">

    <div class="bg-white shadow-lg rounded-xl p-10 w-full max-w-md">
        <h1 class="text-3xl font-bold text-center text-purple-700 mb-6">Admin Login</h1>

        <form method="POST" class="space-y-5">
            {% csrf_token %}
            
            <!-- Email -->
            <div>
                <label for="email" class="block text-gray-700 font-semibold mb-2">Email</label>
                <input type="email" name="email" id="email" placeholder="admin@example.com" required
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-400 focus:outline-none">
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-gray-700 font-semibold mb-2">Password</label>
                <input type="password" name="password" id="password" placeholder="Enter your password" required
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-400 focus:outline-none">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-purple-700 text-white px-4 py-2 rounded-lg hover:bg-purple-800 transition font-semibold">
                Login
            </button>

            <!-- Optional Forgot Password -->
            <p class="text-center text-gray-500 text-sm mt-3">
                Forgot password? <a href="#" class="text-purple-700 hover:underline">Reset here</a>
            </p>
        </form>
    </div>

</body>
</html>
