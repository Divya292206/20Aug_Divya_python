<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/static/img/image.png" type="image/x-icon">

    <title>NotesApp | Profile</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #c4abdb, #f0d9ff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

       
        .navbar-brand {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .register-card {
            max-width: 500px;
            margin: 30px auto;
            padding: 30px;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.1);
        }

        .btn-register {
            background-color: #6f42c1;
            color: white;
            border-radius: 8px;
        }

        .btn-register:hover {
            background-color: #59359a;
        }
    </style>
</head>
<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="/">
            <img src="/static/img/image.png" style="width:40px; height:40px; object-fit:contain;">
            NotesApp
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Navbar Menu -->
            <ul class="navbar-nav mx-auto">
                <li class="nav-item px-2"><a class="nav-link text-white" href="/">Home</a></li>
                <li class="nav-item px-2"><a class="nav-link text-white" href="/notes">Notes</a></li>
                <li class="nav-item px-2"><a class="nav-link text-white" href="/about">About</a></li>
                <li class="nav-item px-2"><a class="nav-link text-white" href="/contact">Contact</a></li>
            </ul>

            <!-- Right Side Buttons -->
            {% if user is none %}
            <div class="d-flex">
                <a href="/signup" class="btn btn-outline-light rounded-pill px-4">Signup</a>
                <a href="/login" class="btn btn-light text-dark rounded-pill px-4 mx-2">Login</a>
            </div>

            {% else %}
            <!-- Profile Dropdown -->
            <div class="dropdown">
                <button class="btn btn-light text-dark rounded-pill px-4 dropdown-toggle"
                        type="button" data-bs-toggle="dropdown">
                    {{ user }}
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" href="/userlogout">Logout</a></li>
                </ul>
            </div>
            {% endif %}

        </div>
    </div>
</nav>
<!-- Navbar End -->


<!-- Hero Section -->
<section>
    <h2 style="text-align: center; margin-top: 2rem; margin-bottom: 2rem;">Welcome to Your Profile</h2>
</section>


<!-- Update Profile Form -->
<div class="container">
    <div class="register-card">
        <h3 class="text-center mb-1">Update Your Profile</h3>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" value="{{ cuser.name }}" class="form-control" placeholder="Enter your full name">
            </div>

            <div class="mb-3">
                <label class="form-label">Email Address</label>
                <input type="email" name="email"  disabled value="{{ cuser.email }}" class="form-control" placeholder="Enter your email">
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" name="phone" value="{{cuser.phone}}" class="form-control" placeholder="Enter your phone number">
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password"  disabled value="{{ cuser.password }}" class="form-control" placeholder="Create password">
            </div>

            <button type="submit" class="btn btn-register w-100 py-2">Update</button>
        </form>
    </div>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
