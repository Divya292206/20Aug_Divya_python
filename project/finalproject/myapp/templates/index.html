<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/static/img/image.png" type="image/x-icon">

    <title>NotesApp | Welcome</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #c4abdb, #f0d9ff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Hero Section */
        .hero {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #fff;
            position: relative;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        .hero p {
            font-size: 1.3rem;
            margin: 20px 0;
            color: #f8f9fa;
        }

        .hero .btn-primary {
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            transition: 0.3s;
        }

        .hero .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Navbar */
        .navbar-brand {
            font-size: 28px;
            letter-spacing: 2px;
            font-weight: 700;
        }
    </style>
</head>
<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="/"> <img src="/static/img/image.png" alt="NotesApp Logo" style="width:40px; height:40px; object-fit:contain;">
    NotesApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
             <ul class="navbar-nav mx-auto">
                <li class="nav-item px-2"><a class="nav-link text-white" href="/">Home</a></li>
                <li class="nav-item px-2"><a class="nav-link text-white" href="/notes">Notes</a></li>
                {% if user %}
                <li class="nav-item px-2"><a class="nav-link text-white" href="/profile">Profile</a></li>
                {% endif %}
                <li class="nav-item px-2"><a class="nav-link text-white" href="/about">About</a></li>
                <li class="nav-item px-2"><a class="nav-link text-white active" href="/contact">Contact</a></li>
            </ul>
            {% if user is none %}
            <div class="d-flex">
                <a href="/signup" class="btn btn-outline-light rounded-pill px-4 ">Signup</a>
                <a href="/login" class="btn btn-light text-dark rounded-pill px-4 mx-2">Login</a>
            </div>
            {% else %}
   

    <!-- Profile Dropdown -->
    <div class="dropdown">
        <button class="btn btn-light text-dark rounded-pill px-4 dropdown-toggle" 
                type="button" data-bs-toggle="dropdown">
            {{user}}
        </button>

        <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/profile">Update Profile</a></li>
            <li><a class="dropdown-item" href="/userlogout">Logout</a></li>
        </ul>
    </div>
            {% endif %}

</div>

        </div>
    </div>
</nav>


<!-- Navbar End -->

<!-- Hero Section Start -->
<section class="hero">
    <h1>Welcome to NotesApp</h1>
    <p>Your personal space to organize, write, and manage your notes effortlessly.</p>
   
</section>
<!-- Hero Section End -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
