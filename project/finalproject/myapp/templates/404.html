<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 | Page Not Found</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">
    
    <!-- 404 Number -->
    <h1 class="text-8xl font-extrabold text-purple-600">404</h1>

    <!-- Message -->
    <h2 class="text-2xl font-semibold text-gray-800 mt-4">
      Page Not Found
    </h2>
    <p class="text-gray-500 mt-3">
      Sorry, the page you are looking for doesn’t exist or has been moved.
    </p>

    <!-- Buttons -->
    <div class="mt-8 flex justify-center gap-4">
      <a href="/" class="px-6 py-3 rounded-xl bg-purple-600 text-white font-medium hover:bg-purple-700 transition">
        Go Home
      </a>
      <a href="javascript:history.back()" class="px-6 py-3 rounded-xl border border-purple-600 text-purple-600 font-medium hover:bg-purple-50 transition">
        Go Back
      </a>
    </div>

  </div>

</body>
</html>
