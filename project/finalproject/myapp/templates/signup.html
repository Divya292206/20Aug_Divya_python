<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/static/img/image.png" type="image/x-icon">

  <title>NotesApp | SignUp</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeInUp 0.9s ease-out forwards;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-purple-600 via-pink-500 to-blue-500 min-h-screen flex items-center justify-center px-4">

  <!-- Signup Card -->
  <div class="w-full max-w-lg bg-white/20 backdrop-blur-xl border border-white/30 shadow-2xl rounded-2xl p-8 fade-in">

    <!-- Logo + Heading -->
    <div class="text-center mb-6">
      <h1 class="text-4xl font-extrabold text-white drop-shadow-xl">Create Account</h1>
      <p class="text-white/80 mt-1">Join NotesApp today</p>
    </div>

    <!-- Form -->
    <form method="post">
      {% csrf_token %}

      <!-- Full Name -->
      <div class="relative mb-6">
        <input 
          type="text" 
          name="name"
          placeholder=" "
          class="peer w-full px-4 py-3 bg-white/20 text-white border border-white/40 
                 rounded-lg focus:ring-2 focus:ring-yellow-300 focus:outline-none"
        >
        <label 
          class="absolute left-4 top-3 text-white/70 transition-all 
                 peer-placeholder-shown:top-3 peer-placeholder-shown:text-base
                 peer-focus:-top-3 peer-focus:text-sm peer-focus:text-yellow-300">
          Full Name
        </label>
      </div>

      <!-- Email -->
      <div class="relative mb-6">
        <input 
          type="email" 
          name="email"
          placeholder=" "
          class="peer w-full px-4 py-3 bg-white/20 text-white border border-white/40 
                 rounded-lg focus:ring-2 focus:ring-yellow-300 focus:outline-none"
        >
        <label 
          class="absolute left-4 top-3 text-white/70 transition-all 
                 peer-placeholder-shown:top-3 peer-placeholder-shown:text-base
                 peer-focus:-top-3 peer-focus:text-sm peer-focus:text-yellow-300">
          Email Address
        </label>
      </div>

      <!-- Phone -->
      <div class="relative mb-6">
        <input 
          type="text" 
          name="phone"
          placeholder=" "
          class="peer w-full px-4 py-3 bg-white/20 text-white border border-white/40 
                 rounded-lg focus:ring-2 focus:ring-yellow-300 focus:outline-none"
        >
        <label 
          class="absolute left-4 top-3 text-white/70 transition-all 
                 peer-placeholder-shown:top-3 peer-placeholder-shown:text-base
                 peer-focus:-top-3 peer-focus:text-sm peer-focus:text-yellow-300">
          Phone Number
        </label>
      </div>

      <!-- Password -->
      <div class="relative mb-8">
        <input 
          type="password" 
          name="password"
          placeholder=" "
          class="peer w-full px-4 py-3 bg-white/20 text-white border border-white/40 
                 rounded-lg focus:ring-2 focus:ring-yellow-300 focus:outline-none"
        >
        <label 
          class="absolute left-4 top-3 text-white/70 transition-all 
                 peer-placeholder-shown:top-3 peer-placeholder-shown:text-base
                 peer-focus:-top-3 peer-focus:text-sm peer-focus:text-yellow-300">
          Password
        </label>
      </div>

      <!-- Register Button -->
      <button 
        type="submit"
        class="w-full bg-yellow-300 text-gray-900 py-3 rounded-lg font-bold shadow-lg 
               hover:bg-white transition">
        Register
      </button>
    </form>

    <!-- Login Link -->
    <p class="text-center mt-6 text-white/90">
      Already have an account?
      <a href="/login" class="text-yellow-300 font-semibold hover:underline">Login</a>
    </p>

    <!-- Back Home -->
    <p class="text-center mt-4">
      <a href="/" class="text-white font-medium hover:underline">← Go to Home</a>
    </p>

  </div>

</body>
</html>
