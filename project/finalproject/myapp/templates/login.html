<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/static/img/image.png" type="image/x-icon">
  <title>NotesApp | Login</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in {
      animation: fadeInUp 1s ease-out forwards;
    }
  </style>

</head>

<body class="bg-gradient-to-br from-purple-600 via-pink-500 to-blue-500 min-h-screen flex items-center justify-center px-4">

  <div class="max-w-md w-full bg-white/20 backdrop-blur-xl rounded-2xl shadow-2xl p-8 fade-in border border-white/30">

    <!-- Logo + Title -->
    <div class="text-center mb-6">
      <h1 class="text-4xl font-extrabold text-white drop-shadow-xl">Welcome Back</h1>
      <p class="text-white/80 mt-1">Login to continue</p>
    </div>

    <!-- Error Message -->
    <h4 class="text-center text-yellow-300 font-medium mb-3">{{ msg }}</h4>

    <!-- Login Form -->
    <form method="post">
      {% csrf_token %}

      <!-- Email -->
      <div class="relative mb-6">
        <input 
          type="email" 
          name="email"
          class="peer w-full px-4 py-3 bg-white/20 text-white placeholder-transparent border border-white/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-300"
          placeholder="Email"
        />
        <label class="absolute left-4 -top-3.5 bg-transparent text-white text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-white/70 peer-placeholder-shown:top-3 peer-focus:-top-3.5 peer-focus:text-sm peer-focus:text-yellow-300">
          Email Address
        </label>
      </div>

      <!-- Password -->
      <div class="relative mb-6">
        <input 
          type="password" 
          name="password"
          class="peer w-full px-4 py-3 bg-white/20 text-white placeholder-transparent border border-white/40 rounded-lg focus:outline-none focus:ring-2 focus:ring-yellow-300"
          placeholder="Password"
        />
        <label class="absolute left-4 -top-3.5 bg-transparent text-white text-sm transition-all peer-placeholder-shown:text-base peer-placeholder-shown:text-white/70 peer-placeholder-shown:top-3 peer-focus:-top-3.5 peer-focus:text-sm peer-focus:text-yellow-300">
          Password
        </label>
      </div>

      <!-- Button -->
      <button 
        type="submit"
        class="w-full bg-yellow-300 text-gray-900 py-3 rounded-lg font-bold shadow-lg hover:bg-white hover:shadow-yellow-300 transition"
      >
        Login
      </button>
    </form>

    <!-- Signup -->
    <p class="text-center mt-6 text-white/80">
      Don't have an account? 
      <a href="/signup" class="text-yellow-300 font-semibold hover:underline">
        Sign up
      </a>
    </p>

    <!-- Back to Home -->
    <p class="text-center mt-4">
      <a href="/" class="text-white font-medium hover:underline">
        ← Go to Home
      </a>
    </p>

  </div>

</body>
</html>
