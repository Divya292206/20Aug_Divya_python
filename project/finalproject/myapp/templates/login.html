<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/static/img/image.png" type="image/x-icon">
  <title>NotesApp | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #c4abdb, #f0d9ff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar-brand {
      font-size: 28px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    /* Hero Section */
    .hero {
      height: 40vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    .hero p {
      font-size: 1.2rem;
      margin: 15px 0;
      color: #f8f9fa;
    }

    /* Login Form */
    .login-card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: -50px auto 50px; /* overlap hero */
      padding: 30px;
    }

    .login-card h3 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
      color: #343a40;
    }

    .btn-login {
      background-color: #343a40;
      color: #fff;
      font-weight: 500;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-login:hover {
      background-color: #495057;
      color: #fff;
    }

    .signup-link {
      text-align: center;
      display: block;
      margin-top: 15px;
      color: #343a40;
      text-decoration: none;
      font-weight: 500;
    }

    .signup-link:hover {
      text-decoration: underline;
      color: #495057;
    }
  </style>
</head>
<body>



<!-- Hero Section -->
<section class="hero">
  <h1>Welcome Login</h1>
</section>

<!-- Login Form -->
<div class="container">
  <div class="login-card">
    <h3>Login</h3>
    <h4 class="text-center text-danger">{{ msg }}</h4>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="emailInput" class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" id="emailInput" placeholder="Enter your email">
      </div>
      <div class="mb-3">
        <label for="passwordInput" class="form-label">Password</label>
        <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Enter your password">
      </div>
      <button type="submit" class="btn btn-login w-100 py-2">Login</button>
    </form>
    <a href="/signup" class="signup-link">Don't have an account? Sign up</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
