<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="/static/img/image.png" type="image/x-icon">

  <title>NotesApp | Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #c4abdb, #f0d9ff);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar-brand {
      font-size: 28px;
      letter-spacing: 2px;
      font-weight: 700;
    }

    /* Hero Section */
    .hero {
      height: 30vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: #fff;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 700;
      text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
    }

    .hero p {
      font-size: 1.2rem;
      margin: 15px 0;
      color: #f8f9fa;
    }

    /* Contact Form */
    .contact-card {
      background-color: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      max-width: 500px;
      margin: -50px auto 50px; /* overlap hero */
      padding: 30px;
    }

    .contact-card h3 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 600;
      color: #343a40;
    }

    .btn-contact {
      background-color: #343a40;
      color: #fff;
      font-weight: 500;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-contact:hover {
      background-color: #495057;
      color: #fff;
    }

    .info-text {
      text-align: center;
      margin-top: 15px;
      color: #343a40;
      font-weight: 500;
    }
  </style>
</head>
<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
  <div class="container">
    <a class="navbar-brand" href="/"> <img src="/static/img/image.png" alt="NotesApp Logo" style="width:40px; height:40px; object-fit:contain;">
    </a>
    <a class="navbar-brand" href="#">NotesApp</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item px-2"><a class="nav-link text-white" href="/">Home</a></li>
        <li class="nav-item px-2"><a class="nav-link text-white" href="/notes">Notes</a></li>
        {% if user %}
        <li class="nav-item px-2"><a class="nav-link text-white" href="/profile">Profile</a></li>
        {% endif %}
        <li class="nav-item px-2"><a class="nav-link text-white" href="/about">About</a></li>
        <li class="nav-item px-2"><a class="nav-link text-white active" href="/contact">Contact</a></li>
      </ul>
      <div class="d-flex">
        <a href="/signup" class="btn btn-outline-light rounded-pill px-4 mx-2">Signup</a>
        <a href="/login" class="btn btn-light text-dark rounded-pill px-4">Login</a>
      </div>
    </div>
  </div>
</nav>
<!-- Navbar End -->

<!-- Hero Section -->
<section class="hero">
  <h1>Contact Us</h1>
  <p>We’d love to hear from you! Send us a message.</p>
</section>

<!-- Contact Form -->
<div class="container">
  <div class="contact-card">
    <h3>Send a Message</h3>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="nameInput" class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" id="nameInput" placeholder="Enter your full name" required>
      </div>

      <div class="mb-3">
        <label for="emailInput" class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" id="emailInput" placeholder="Enter your email" required>
      </div>

      <div class="mb-3">
        <label for="subjectInput" class="form-label">Subject</label>
        <input type="text" name="subject" class="form-control" id="subjectInput" placeholder="Subject" required>
      </div>

      <div class="mb-3">
        <label for="messageInput" class="form-label">Message</label>
        <textarea name="msg" class="form-control" id="messageInput" rows="5" placeholder="Write your message..." required></textarea>
      </div>

      <button type="submit" class="btn btn-contact w-100 py-2">Send Message</button>
    </form>
    <p class="info-text">We'll get back to you within 24 hours.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
