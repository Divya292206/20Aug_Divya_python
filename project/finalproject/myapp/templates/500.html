<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>500 | Server Error</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-red-500 via-orange-500 to-yellow-500 min-h-screen flex items-center justify-center">

  <div class="bg-white rounded-2xl shadow-2xl p-10 max-w-md w-full text-center">

    <!-- Error Code -->
    <h1 class="text-8xl font-extrabold text-red-600">500</h1>

    <!-- Message -->
    <h2 class="text-2xl font-semibold text-gray-800 mt-4">
      Internal Server Error
    </h2>

    <p class="text-gray-500 mt-3">
      Oops! Something went wrong on our side.
      Please try again later or contact support.
    </p>

    <!-- Buttons -->
    <div class="mt-8 flex justify-center gap-4">
      <a href="/" class="px-6 py-3 rounded-xl bg-red-600 text-white font-medium hover:bg-red-700 transition">
        Go Home
      </a>
      <button onclick="location.reload()" class="px-6 py-3 rounded-xl border border-red-600 text-red-600 font-medium hover:bg-red-50 transition">
        Retry
      </button>
    </div>

  </div>

</body>
</html>
