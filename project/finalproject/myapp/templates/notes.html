<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/static/img/image.png" type="image/x-icon">

    <title>NotesApp | Notes</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">


    <style>
        body {
            background: linear-gradient(135deg, #c4abdb, #f0d9ff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

    
        /* Navbar */
        .navbar-brand {
            font-size: 28px;
            letter-spacing: 2px;
            font-weight: 700;
        }
    </style>
</head>
<body>

<!-- Navbar Start -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
    <div class="container">
        <a class="navbar-brand" href="/"> <img src="/static/img/image.png" alt="NotesApp Logo" style="width:40px; height:40px; object-fit:contain;">
    </a>
        <a class="navbar-brand" href="#">NotesApp</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav mx-auto">
                <li class="nav-item px-2"><a class="nav-link text-white" href="/">Home</a></li>
                <li class="nav-item px-2"><a class="nav-link text-white active" href="#">Notes</a></li>
                {% if user %}
                <li class="nav-item px-2"><a class="nav-link text-white" href="/profile">Profile</a></li>
                {% endif %}
                <li class="nav-item px-2"><a class="nav-link text-white" href="/about">About</a></li>
                <li class="nav-item px-2"><a class="nav-link text-white" href="/contact">Contact</a></li>
            </ul>
            
            <div class="d-flex">
                <a href="/signup" class="btn btn-outline-light rounded-pill px-4 mx-2">Signup</a>
                <a href="/login" class="btn btn-light text-dark rounded-pill px-4">Login</a>
            </div>
        </div>
    </div>
</nav>


<!-- Navbar End -->

<!-- notes form start -->

<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4 text-center">Add Notes</h3>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- Notes Title -->
            <div class="mb-3">
                <label class="form-label">Notes Title</label>
                <input type="text" class="form-control" name="title" placeholder="Enter note title" required>
            </div>

            <!-- Dropdown -->
            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" name="category" required>
                    <option selected disabled>Select category</option>
                    <option value="Work">Work</option>
                    <option value="Study">Study</option>
                    <option value="Personal">Personal</option>
                    <option value="Important">Important</option>
                </select>
            </div>

            <!-- File Upload -->
            <div class="mb-3">
                <label class="form-label">Upload File</label>
                <input type="file" class="form-control" name="file">
            </div>

            <!-- Textarea -->
            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea class="form-control" name="desc" rows="4" placeholder="Write your notes..." required></textarea>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-primary w-100">Submit</button>
        </form>
    </div>
</div>

<!-- notes form end -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
