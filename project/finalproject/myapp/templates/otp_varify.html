<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f5f5;
        }
        .otp-box {
            max-width: 420px;
            margin: 80px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .btn-verify {
            background: #007bff;
            color: #fff;
            font-weight: 600;
        }
       
    </style>
</head>
<body>

<div class="otp-box">
    <h2 class="text-center text-danger">{{ msg }}</h2>
    <h3 class="text-center mb-4">Verify OTP</h3>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Enter OTP</label>
            <input type="number" name="otp" class="form-control" placeholder="Enter your OTP" required>
        </div>

        <button type="submit" class="btn btn-verify w-100 py-2">Verify</button>
    </form>
</div>

</body>
</html>
