<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OTP Verification</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <div class="bg-white max-w-md w-full p-8 rounded-xl shadow-lg">
    
    <h2 class="text-center text-red-600 text-lg font-semibold mb-2">{{ msg }}</h2>
    <h3 class="text-center text-2xl font-bold mb-5">Verify OTP</h3>

    <form method="post" class="space-y-4">
      {% csrf_token %}

      <div>
        <label class="block text-gray-700 font-medium mb-1">Enter OTP</label>
        <input type="number" name="otp" required
          class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-purple-400 focus:outline-none"
          placeholder="Enter your OTP">
      </div>

      <button type="submit"
        class="w-full py-2 bg-purple-700 text-white font-semibold rounded-lg hover:bg-purple-800 transition">
        Verify
      </button>
    </form>

  </div>

</body>
</html>
