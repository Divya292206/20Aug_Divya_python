<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Users</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

  <!-- Navbar -->
  <nav class="bg-gradient-to-r from-purple-700 to-pink-600 text-white px-6 py-4 flex justify-between items-center shadow-lg">
    <h1 class="font-extrabold text-2xl tracking-wide">NotesApp Admin</h1>
    <a href="/adminapp/admin_logout" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 transition font-semibold shadow">Logout</a>
  </nav>

  <div class="flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white shadow-lg h-auto md:h-screen p-6 rounded-r-xl">
      <h2 class="text-lg font-bold mb-6 text-purple-700 tracking-wide">Menu</h2>
      <ul class="space-y-3">
        <li><a href="/adminapp/admin_dashboard" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700">Dashboard</a></li>
        <li><a href="#" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700 font-semibold"><b>Users</b></a></li>
        <li><a href="/adminapp/admin_notes" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700">Notes</a></li>
        <li><a href="/adminapp/admin_contact" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700">Contact</a></li>

      </ul>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">

      <h2 class="text-3xl font-extrabold mb-6 text-gray-800 tracking-wide">User Management</h2>

      <!-- User Table -->
      <div class="bg-white rounded-xl shadow overflow-x-auto p-4">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Create_at</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Email</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Phone</th>
              <th class="px-4 py-2 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200">
            {% for u in udata %}
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2">{{ u.id }}</td>
              <td class="px-4 py-2">{{ u.created_at }}</td>
              <td class="px-4 py-2">{{ u.name }}</td>
              <td class="px-4 py-2">{{ u.email }}</td>
              <td class="px-4 py-2">{{ u.phone }}</td>
              <td class="px-4 py-2 space-x-2">
                <a href="/adminapp/admin_user_view/{{u.id}}" class="px-2 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm">View</a>
                <a href="/adminapp/admin_user_delete/{{ u.id }}/" 
                  class="px-2 py-1 bg-red-500 text-white rounded hover:bg-red-600 text-sm"
                  onclick="return confirm('Are you sure you want to delete this user?')">
                  Delete
                </a>
              </td>
            </tr>

            {% endfor %}
          </tbody>
        </table>
      </div>

    </main>
  </div>

</body>

</html>
