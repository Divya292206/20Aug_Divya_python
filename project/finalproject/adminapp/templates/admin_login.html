<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | NotesApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(135deg, #7f00ff, #e100ff, #ff8c00);
    }

    .glass {
      backdrop-filter: blur(15px);
      background: rgba(255, 255, 255, 0.15);
    }

    .floating-icon {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center px-4">

  <!-- Login Card -->
  <div class="glass shadow-2xl rounded-3xl p-10 w-full max-w-md relative overflow-hidden">
    
    <!-- Decorative Circles -->
    <div class="absolute -top-16 -left-16 w-40 h-40 bg-purple-500/40 rounded-full filter blur-3xl animate-float"></div>
    <div class="absolute -bottom-16 -right-16 w-40 h-40 bg-pink-500/40 rounded-full filter blur-3xl animate-float"></div>

    <!-- Logo -->
    <div class="text-center mb-8 relative z-10">
      <h2 class="text-3xl font-bold text-white drop-shadow-md">Admin Login</h2>
      <p class="text-white/80 mt-1">Enter your credentials to access the dashboard</p>
    </div>

    <!-- Error Message -->
    {% if msg %}
    <div class="bg-red-100 text-red-700 p-3 rounded mb-4 text-center font-medium relative z-10">
      {{ msg }}
    </div>
    {% endif %}

    <!-- Login Form -->
    <form method="post" class="space-y-6 relative z-10">
      {% csrf_token %}

      <!-- Username -->
      <div>
        <input type="text" name="username" placeholder="Username"
               class="w-full px-4 py-3 rounded-xl border border-white/40 bg-white/20 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
      </div>

      <!-- Password -->
      <div>
        <input type="password" name="password" placeholder="Password"
               class="w-full px-4 py-3 rounded-xl border border-white/40 bg-white/20 text-white placeholder-white/70 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-transparent transition">
      </div>

      <!-- Login Button -->
      <button type="submit"
              class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold py-3 rounded-xl shadow-lg transition transform hover:scale-105">
        Login
      </button>
    </form>

    <!-- Back to Home -->
    <p class="text-center mt-6 text-white/70 text-sm relative z-10">
      <a href="/" class="hover:text-yellow-300 transition">← Back to Home</a>
    </p>
  </div>

</body>
</html>
