<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | NotesApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-purple-100 to-pink-100 min-h-screen font-sans">

  <!-- Navbar -->
  <nav class="bg-gradient-to-r from-purple-700 to-pink-600 text-white px-6 py-4 flex justify-between items-center shadow-lg">
    <h1 class="font-extrabold text-2xl tracking-wide">NotesApp Admin</h1>
    <a href="/adminapp/admin_logout" class="bg-red-500 px-4 py-2 rounded-lg hover:bg-red-600 transition font-semibold shadow">Logout</a>
  </nav>

  <div class="flex flex-col md:flex-row">

    <!-- Sidebar -->
    <aside class="w-full md:w-64 bg-white shadow-lg h-auto md:h-screen p-6 rounded-r-xl">
      <h2 class="text-lg font-bold mb-6 text-purple-700 tracking-wide">Menu</h2>
      <ul class="space-y-3">
        <li><a href="#" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700 font-semibold"><b>Dashboard</b></a></li>
        <li><a href="/adminapp/admin_userdata" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700">Users</a></li>
        <li><a href="/adminapp/admin_notes" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700">Notes</a></li>
        <li><a href="/adminapp/admin_contact" class="block p-3 rounded-lg hover:bg-purple-100 transition font-medium text-gray-700">Contact</a></li>

      </ul>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6">

      <h2 class="text-3xl font-extrabold mb-6 text-gray-800 tracking-wide">Welcome, Admin!</h2>

      <!-- Cards Row -->
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mb-6">

        <!-- Card 1 -->
        <div class="bg-gradient-to-r from-purple-500 to-purple-700 text-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-1">
        <h3 class="text-lg font-semibold">Total Users</h3>
        <p class="text-4xl font-bold mt-2">{{ total_users }}</p>
        </div>

         <!-- Card 2 -->
        <div class="bg-gradient-to-r from-purple-500 to-purple-700 text-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-1">
        <h3 class="text-lg font-semibold">Total Notes</h3>
        <p class="text-4xl font-bold mt-2">{{ total_notes }}</p>
        </div>


        <!-- Card 3 -->
        <div class="bg-gradient-to-r from-pink-500 to-pink-700 text-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-1">
        <h3 class="text-lg font-semibold">Pending Notes</h3>
        <p class="text-4xl font-bold mt-2">{{ total_pending }}</p>
        </div>

        <!-- Card 4 -->
        <div class="bg-gradient-to-r from-pink-500 to-pink-700 text-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-1">
        <h3 class="text-lg font-semibold">Approval Notes</h3>
        <p class="text-4xl font-bold mt-2">{{ total_approval }}</p>
        </div>

        <!-- Card 5 -->
        <div class="bg-gradient-to-r from-pink-500 to-pink-700 text-white p-6 rounded-xl shadow-lg hover:shadow-2xl transition transform hover:-translate-y-1">
        <h3 class="text-lg font-semibold">Rejected Notes</h3>
        <p class="text-4xl font-bold mt-2">{{ total_rejected }}</p>
        </div>

      </div>

    </main>
  </div>

</body>

</html>
