<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoreApi</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Header -->
    <header class="bg-indigo-600 py-6 shadow-md">
        <h1 class="text-center text-3xl font-bold text-white tracking-wide">
            Store API Products
        </h1>
    </header>

    <!-- Container -->
    <div class="max-w-7xl mx-auto px-4 py-10">

        <!-- Table Card -->
        <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
            <table class="min-w-full border border-gray-200">
                
                <!-- Table Head -->
                <thead class="bg-indigo-100">
                    <tr>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">ID</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Title</th>
                        <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Description</th>
                        <th class="px-6 py-3 text-center text-sm font-semibold text-gray-700">Image</th>
                    </tr>
                </thead>

                <!-- Table Body -->
                <tbody class="divide-y divide-gray-200">
                    {% for i in data %}
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-6 py-4 text-sm text-gray-800 font-medium">
                            {{ i.id }}
                        </td>

                        <td class="px-6 py-4 text-sm text-gray-800">
                            {{ i.title }}
                        </td>

                        <td class="px-6 py-4 text-sm text-gray-600 max-w-md">
                            {{ i.description|truncatewords:20 }}
                        </td>

                        <td class="px-6 py-4 flex justify-center">
                            <img 
                                src="{{ i.image }}" 
                                alt="product image"
                                class="w-20 h-20 object-contain rounded-lg border border-gray-300 bg-white p-1">
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>

            </table>
        </div>

    </div>

</body>
</html>
