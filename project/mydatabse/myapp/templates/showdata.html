<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #333;
            border: #333 2px solid;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
        }
        table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            text-align: center;
        }
        .btn-edit {
            background-color: #4CAF50;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
        .btn-delete {
            background-color: red;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h1>Show All Data</h1>

    <div class="container">

        <table border="1" width="100%" cellpadding="10" cellspacing="0">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Mobile</th>
                <th>DOB</th>
                <th>Actions</th>
            </tr>

            {% for i in data %}
            <tr>
                <td>{{ i.id }}</td>
                <td>{{ i.name }}</td>
                <td>{{ i.email }}</td>
                <td>{{ i.mobile }}</td>
                <td>{{ i.dob }}</td>

                <td>
                    <!-- Edit button -->
                    <a href="/updatedata/{{i.id}}" class="btn-edit">Edit</a>

                    <!-- Delete button -->
                    <a href="/deletedata/{{i.id}}" class="btn-delete">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </table>

    </div>

</body>
</html>
