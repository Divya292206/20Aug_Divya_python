<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-white shadow-md py-4 px-6 flex justify-between items-center">
        <h1 class="text-2xl font-bold text-gray-800">My Website , {{cuser}}</h1>

        <ul class="flex space-x-6 text-gray-700 font-medium">
            <li><a href="#" class="hover:text-blue-500">Home</a></li>
            <li><a href="#" class="hover:text-blue-500">About</a></li>
            <li><a href="#" class="hover:text-blue-500">Services</a></li>
            <li><a href="#" class="hover:text-blue-500">Contact</a></li>

            {% if cuser is none %}
            <li>
                <a href="/" class="bg-red-500 text-white px-4 py-1 rounded hover:bg-red-600">
                    Login
                </a>
            
            </li>
            
            {% else %}
            <li>
                <a href="/userlogout/" class="bg-red-500 text-white px-4 py-1 rounded hover:bg-red-600">
                    Logout
                </a>
            </li>
            {% endif %}
        </ul>
    </nav>

    <!-- Welcome Section -->
    <div class="flex justify-center items-center h-[80vh]">
        <h2 class="text-4xl font-bold text-gray-800">
            Welcome! You have logged in successfully 🎉
        </h2>
    </div>

</body>
</html>
