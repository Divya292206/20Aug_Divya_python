<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
          crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding-top: 50px;
            background: linear-gradient(135deg, #6a11cb, #2575fc); /* Same gradient as login */
            height: 100vh;
            color: white;
        }
        .register-card {
            max-width: 500px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
            color: #333;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #222;
            font-weight: bold;
        }
        .btn-success {
            background-color: #2575fc;   /* Matching button color */
            border: none;
        }
        .btn-success:hover {
            background-color: #1b58d6;
        }
        /* a {
            text-align: center;
            display: block;
            margin-top: 15px;
            color: #ffffff;
            font-weight: bold;
            text-decoration: underline;
        } */
        a:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>

    <div class="register-card">
        <h2>Create an Account</h2>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="nameInput">Full Name</label>
                <input type="text" name="name" class="form-control" id="nameInput" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label for="emailInput">Email address</label>
                <input type="email" name="email" class="form-control" id="emailInput" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="phoneInput">Phone Number</label>
                <input type="text" name="phone" class="form-control" id="phoneInput" placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label for="passwordInput">Password</label>
                <input type="password" name="password" class="form-control" id="passwordInput" placeholder="Create password">
            </div>

            <!-- <div class="form-group">
                <label for="confirmPasswordInput">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPasswordInput" placeholder="Re-enter password">
            </div> -->

            <button type="submit" class="btn btn-success btn-block">Register</button>
        </form><br>

        <a href="/">Already have an account? Login</a>
    </div>

</body>
</html>
